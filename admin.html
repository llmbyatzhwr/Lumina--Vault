<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Vault | لوحة تحكم المالك</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Firebase App, Auth & Firestore (Compat SDKs) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: {
                        gold: { 100: '#fef9c3', 300: '#fde047', 500: '#eab308', 600: '#ca8a04', 700: '#a16207' },
                        darkBg: '#090d16'
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #070a12; color: #f8fafc; overflow-x: hidden; }
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-nav { background: rgba(7, 10, 18, 0.75); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        #canvas3d { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="relative min-h-screen">

    <canvas id="canvas3d"></canvas>

    <!-- Navigation Bar -->
    <nav class="glass-nav sticky top-0 z-40 px-4 lg:px-12 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-yellow-500 to-amber-200 flex items-center justify-center text-black font-black text-xl shadow-lg shadow-yellow-500/20">
                    L
                </div>
                <div>
                    <span class="text-2xl font-black tracking-wider text-white">Lumina <span class="text-yellow-400">Vault</span></span>
                    <p class="text-[10px] text-slate-400 font-medium tracking-tight">لوحة تحكم المالك الحصرية</p>
                </div>
            </a>

            <div class="flex items-center gap-3">
                <a href="index.html" class="px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-xs text-slate-200 hover:bg-white/20 transition-colors flex items-center gap-2">
                    <i class="fas fa-store text-yellow-400"></i> العودة للمتجر الرئيسي
                </a>
            </div>
        </div>
    </nav>

    <!-- ADMIN CONTENT CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 py-12 relative z-10">
        
        <!-- Login View -->
        <div id="adminLoginView" class="glass-card rounded-3xl p-8 md:p-12 text-center max-w-lg mx-auto border border-white/20">
            <div class="w-16 h-16 bg-yellow-500/20 border border-yellow-400/40 rounded-2xl flex items-center justify-center mx-auto mb-4 text-yellow-400 text-2xl">
                <i class="fas fa-user-shield"></i>
            </div>
            <h3 class="text-2xl font-bold text-white mb-2">تسجيل دخول المالك</h3>
            <p class="text-slate-400 text-sm mb-6">أدخلي بريدك الإلكتروني وكلمة المرور المسجلة في منصة Firebase للوصول للوحة التحكم</p>

            <form onsubmit="handleFirebaseLogin(event)" class="space-y-4">
                <input type="email" id="adminEmail" placeholder="البريد الإلكتروني للإدارة" required class="w-full bg-black/50 border border-white/20 rounded-xl px-4 py-3 text-white text-center focus:outline-none focus:border-yellow-400 text-sm">
                <input type="password" id="adminPassword" placeholder="كلمة المرور" required class="w-full bg-black/50 border border-white/20 rounded-xl px-4 py-3 text-white text-center tracking-widest focus:outline-none focus:border-yellow-400 text-sm">
                <button type="submit" class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded-xl transition-colors">
                    دخول لوحة التحكم
                </button>
                <p id="loginError" class="text-red-400 text-xs hidden"></p>
            </form>
        </div>

        <!-- Admin Dashboard View -->
        <div id="adminDashboardView" class="hidden space-y-8">
            <div class="glass-card rounded-3xl p-6 md:p-8 border border-white/20">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fas fa-plus-circle text-yellow-400"></i> إضافة منتج جديد (مع ضغط الصور تلقائياً)
                    </h3>
                    <button onclick="adminLogout()" class="text-xs text-red-400 hover:underline">تسجيل الخروج</button>
                </div>

                <form onsubmit="handleAddProduct(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">اسم المنتج</label>
                        <input type="text" id="prodName" required placeholder="مثال: فستان سهرة / طقم إكسسوارات" class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-yellow-400">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">السعر</label>
                            <input type="text" id="prodPrice" required placeholder="مثال: 450 جنيه" class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-yellow-400">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">اختر صور المنتج (يمكنك تحديد عدة صور)</label>
                            <input type="file" id="prodImageFiles" accept="image/*" multiple required class="w-full bg-black/50 border border-white/15 rounded-xl px-3 py-2 text-white text-xs file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-yellow-500 file:text-black hover:file:bg-yellow-400 cursor-pointer">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">وصف المنتج وتفاصيله</label>
                        <textarea id="prodDesc" rows="3" required placeholder="تفاصيل الخامات أو المقاسات المتوفرة..." class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-yellow-400"></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-500 hover:opacity-90 text-black font-bold rounded-xl transition-all shadow-lg shadow-yellow-500/25">
                        رفع ونشر المنتج في قاعدة البيانات
                    </button>
                </form>
            </div>

            <!-- Manage Products -->
            <div class="glass-card rounded-3xl p-6 md:p-8 border border-white/20">
                <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                    <i class="fas fa-boxes text-yellow-400"></i> المنتجات الحالية في المتجر (إدارة وحذف)
                </h3>
                <div id="adminProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
        </div>

    </main>

    <!-- ADMIN APPLICATION LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-tCm6Vl8FWbUEouKagzLDeJs9qCEPE2E",
            authDomain: "lumina-vault-e25e9.firebaseapp.com",
            projectId: "lumina-vault-e25e9",
            storageBucket: "lumina-vault-e25e9.appspot.com",
            messagingSenderId: "300083027193",
            appId: "1:300083027193:web:bce438ab0dabc65bc35628"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let products = [];

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', () => {
            init3DCanvas();

            auth.onAuthStateChanged(user => {
                if (user) {
                    document.getElementById('adminLoginView').classList.add('hidden');
                    document.getElementById('adminDashboardView').classList.remove('hidden');
                    initRealtimeProducts();
                } else {
                    document.getElementById('adminLoginView').classList.remove('hidden');
                    document.getElementById('adminDashboardView').classList.add('hidden');
                }
            });
        });

        function handleFirebaseLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('loginError');

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    errorMsg.classList.add('hidden');
                    document.getElementById('adminPassword').value = '';
                })
                .catch((error) => {
                    errorMsg.innerText = "خطأ في البريد أو كلمة المرور: " + error.message;
                    errorMsg.classList.remove('hidden');
                });
        }

        function adminLogout() {
            auth.signOut();
        }

        function initRealtimeProducts() {
            db.collection("products").onSnapshot((snapshot) => {
                products = [];
                snapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                renderAdminProducts();
            }, (error) => {
                console.error("خطأ في جلب البيانات: ", error);
            });
        }

        function renderAdminProducts() {
            const grid = document.getElementById('adminProductsGrid');
            if (products.length === 0) {
                grid.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-6">لا توجد منتجات حالياً.</p>`;
                return;
            }

            grid.innerHTML = products.map(prod => {
                const mainImg = (prod.images && prod.images.length > 0) ? prod.images[0] : prod.image;
                return `
                    <div class="flex items-center justify-between gap-4 p-3 rounded-2xl bg-white/5 border border-white/10">
                        <div class="w-14 h-14 rounded-xl overflow-hidden bg-black/40 flex-shrink-0">
                            <img src="${escapeHtml(mainImg)}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-bold text-white truncate">${escapeHtml(prod.name)}</h4>
                            <span class="text-xs text-yellow-400 font-bold">${escapeHtml(prod.price)}</span>
                        </div>
                        <button onclick="deleteProduct('${prod.id}')" class="px-3 py-2 bg-red-600/80 hover:bg-red-600 text-white rounded-xl text-xs transition-colors" title="حذف المنتج">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // دالة لضغط الصور تلقائياً في المتصفح قبل رفعها
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function (event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // تحويل الصورة المضغطوعة إلى صيغة base64 خفيفة الحجم جداً
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function handleAddProduct(e) {
            e.preventDefault();
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const desc = document.getElementById('prodDesc').value;
            const fileInput = document.getElementById('prodImageFiles');
            const submitBtn = document.getElementById('submitBtn');

            if (!fileInput.files || fileInput.files.length === 0) {
                alert("يرجى اختيار صورة واحدة على الأقل!");
                return;
            }

            submitBtn.innerText = "جاري ضغط الصور ونشر المنتج...";
            submitBtn.disabled = true;

            try {
                const files = Array.from(fileInput.files);
                let compressedImages = [];

                for (const file of files) {
                    const compressedBase64 = await compressImage(file, 800, 0.7);
                    compressedImages.push(compressedBase64);
                }

                await db.collection("products").add({
                    name: name,
                    price: price,
                    description: desc,
                    images: compressedImages,
                    image: compressedImages[0],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                submitBtn.innerText = "رفع ونشر المنتج في قاعدة البيانات";
                submitBtn.disabled = false;
                e.target.reset();
                alert("✨ تم ضغط الصور ونشر المنتج بنجاح في قاعدة البيانات!");
            } catch (error) {
                console.error("خطأ الرفع:", error);
                alert("حدث خطأ أثناء رفع المنتج: " + error.message);
                submitBtn.innerText = "رفع ونشر المنتج في قاعدة البيانات";
                submitBtn.disabled = false;
            }
        }

        function deleteProduct(id) {
            if (confirm('هل أنتِ متأكدة من إزالة هذا المنتج نهائياً من المتجر؟')) {
                db.collection("products").doc(id).delete()
                .catch((error) => {
                    alert("خطأ أثناء الحذف: " + error.message);
                });
            }
        }

        function init3DCanvas() {
            const canvas = document.getElementById('canvas3d');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = Array.from({ length: 45 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 6 + 2,
                color: Math.random() > 0.5 ? 'rgba(234, 179, 8, ' : 'rgba(99, 102, 241, ',
                alpha: Math.random() * 0.4 + 0.1,
                speedX: (Math.random() - 0.5) * 0.6,
                speedY: (Math.random() - 0.5) * 0.6,
                angle: Math.random() * Math.PI * 2,
                spin: (Math.random() - 0.5) * 0.02
            }));

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.angle += p.spin;

                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + p.alpha + ')';
                    ctx.shadowColor = p.color + '0.8)';
                    ctx.shadowBlur = 15;
                    ctx.fill();
                    ctx.restore();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
